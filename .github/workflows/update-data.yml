name: Update IERS data

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update IERS data
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.8
          bundler-cache: true
      - name: Download latest IERS data
        run: bundle exec rake data:update
      - name: Run tests
        run: bundle exec rake test
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-iers-data
          delete-branch: true
          add-paths: data
          title: "Update `data/` with latest values from IERS"
          commit-message: "Update data with latest values from IERS"
          body: |
            Automated monthly refresh of the bundled IERS data files.

            - Downloaded via `bundle exec rake data:update`, which fails the
              job on a download error, a parse failure, or predictions that
              don't extend far enough ahead.
            - Test suite ran against the refreshed working tree.

            Please review the diff before merging. Note this only refreshes the
            data committed to the repo, a gem release is still needed to ship
            it to users.